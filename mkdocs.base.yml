site_name: Node Nexus API
repo_url: https://github.com/NodeNexusDev/node_nexus_api
repo_name: NodeNexusDev/node_nexus_api
copyright: Copyright &copy; Node Nexus contributors
strict: true
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.breadcrumbs
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
plugins:
  - search
validation:
  nav:
    omitted_files: warn
    absolute_links: ignore
  links:
    absolute_links: ignore
    unrecognized_links: warn
