site_name: Node Nexus API
repo_url: https://github.com/NodeNexusDev/node_nexus_api
repo_name: NodeNexusDev/node_nexus_api
copyright: Copyright &copy; Node Nexus contributors
strict: true
theme:
  name: material
  features:
    - navigation.breadcrumbs
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
plugins:
  - search
validation:
  nav:
    omitted_files: warn
    absolute_links: ignore
  links:
    absolute_links: ignore
    unrecognized_links: warn
