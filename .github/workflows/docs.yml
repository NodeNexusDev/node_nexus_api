name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - "scripts/docs/**"
      - "mkdocs*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: documentation-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Validate documentation
        run: uv run python scripts/docs/check_docs.py

      - name: Export and validate OpenAPI
        run: |
          uv run python scripts/docs/export_openapi.py
          uv run python scripts/docs/validate_openapi.py build/openapi.json

      - name: Build locale sites
        run: |
          uv run mkdocs build --strict -f mkdocs.en.yml
          uv run mkdocs build --strict -f mkdocs.ru.yml
          cp docs/landing/index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
