name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/**"
      - "scripts/docs/**"
      - "mkdocs*.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: documentation-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: docs-ci-only
      MASTER_API_KEY: docs-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Validate documentation
        run: uv run python scripts/docs/check_docs.py

      - name: Export and validate OpenAPI
        run: |
          uv run python scripts/docs/export_openapi.py
          uv run python scripts/docs/validate_openapi.py build/openapi.json
          cp build/openapi.json docs/en/assets/openapi.json
          cp build/openapi.json docs/ru/assets/openapi.json

      - name: Build locale sites
        run: |
          uv run mkdocs build --strict -f mkdocs.en.yml
          uv run mkdocs build --strict -f mkdocs.ru.yml
          cp docs/landing/index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
