name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find version tag in pushed commits
        id: find_tag
        run: |
          # Check each commit in the push for a version tag
          for SHA in $(git rev-list ${{ github.event.before }}..${{ github.sha }}); do
            TAG=$(git tag --points-at "$SHA" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -n "$TAG" ]; then
              echo "Found tag: $TAG on commit $SHA"
              echo "tag=$TAG" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "No version tag found in pushed commits, skipping release"
          echo "skip=true" >> $GITHUB_OUTPUT

      - name: Verify release version
        if: steps.find_tag.outputs.skip == 'false'
        run: |
          TAG_VERSION="${{ steps.find_tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PROJECT_VERSION=$(sed -n 's/^version = "\\([^"]*\\)"/\\1/p' pyproject.toml | head -1)
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi

      - name: Build Docker image
        if: steps.find_tag.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: node-nexus-api:${{ steps.find_tag.outputs.tag }}

      - name: Create GitHub Release
        if: steps.find_tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.find_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            Dockerfile
            docker-compose.yml
