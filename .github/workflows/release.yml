name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find version tag in pushed commits
        id: find_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check each commit in the push for a version tag
          for SHA in $(git rev-list ${{ github.event.before }}..${{ github.sha }}); do
            TAG=$(git tag --points-at "$SHA" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -n "$TAG" ]; then
              echo "Found tag: $TAG on commit $SHA"
              echo "tag=$TAG" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          # Recover a tag whose earlier release run failed.
          for TAG in $(git tag --merged "${{ github.sha }}" --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); do
            STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
            if [ "$STATUS" = "404" ]; then
              echo "Found unreleased tag: $TAG"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" != "200" ]; then
              echo "Unable to check release $TAG: GitHub API returned HTTP $STATUS"
              exit 1
            fi
          done

          echo "No version tag found in pushed commits, skipping release"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        if: steps.find_tag.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ steps.find_tag.outputs.tag }}
        run: |
          TAG_VERSION="$RELEASE_TAG"
          TAG_VERSION="${TAG_VERSION#v}"
          PROJECT_VERSION=$(git show "$RELEASE_TAG:pyproject.toml" | python3 -c \
            'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match pyproject.toml version $PROJECT_VERSION"
            exit 1
          fi

      - name: Check out release tag
        if: steps.find_tag.outputs.skip == 'false'
        run: git checkout --detach "${{ steps.find_tag.outputs.tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.find_tag.outputs.skip == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.find_tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.find_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            Dockerfile
            docker-compose.yml
            docker-compose.build.yml
