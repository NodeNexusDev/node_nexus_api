name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find version tag in pushed commits
        id: find_tag
        run: |
          # Check each commit in the push for a version tag
          for SHA in $(git rev-list ${{ github.event.before }}..${{ github.sha }}); do
            TAG=$(git tag --points-at "$SHA" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -n "$TAG" ]; then
              echo "Found tag: $TAG on commit $SHA"
              echo "tag=$TAG" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "No version tag found in pushed commits, skipping release"
          echo "skip=true" >> $GITHUB_OUTPUT

      - name: Set image tag
        if: steps.find_tag.outputs.skip == 'false'
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/${REPO}:${{ steps.find_tag.outputs.tag }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        if: steps.find_tag.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.image }}

      - name: Create GitHub Release
        if: steps.find_tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.find_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            Dockerfile
            docker-compose.yml
