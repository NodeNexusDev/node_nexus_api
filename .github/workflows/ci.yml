name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: docs-ci-only
      ENVIRONMENT: test
      MASTER_API_KEY: docs-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Check structure, locale parity, Markdown, and local links
        run: uv run python scripts/docs/check_docs.py

      - name: Export and validate OpenAPI
        run: |
          uv run python scripts/docs/export_openapi.py
          uv run python scripts/docs/validate_openapi.py build/openapi.json
          cp build/openapi.json docs/en/assets/openapi.json
          cp build/openapi.json docs/ru/assets/openapi.json

      - name: Build English documentation
        run: uv run mkdocs build --strict -f mkdocs.en.yml

      - name: Build Russian documentation
        run: uv run mkdocs build --strict -f mkdocs.ru.yml

      - name: Smoke test generated sites
        run: |
          test -f site/en/index.html
          test -f site/ru/index.html
          test -f site/en/assets/openapi.json
          test -f site/ru/assets/openapi.json
          test -f site/en/reference/openapi.html
          test -f site/ru/reference/openapi.html
          test -f site/en/assets/javascripts/language-switcher.js
          test -f site/ru/assets/javascripts/language-switcher.js
          grep -q 'hreflang="ru"' site/en/index.html
          grep -q 'hreflang="en"' site/ru/index.html

      - name: Upload documentation preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-preview
          path: site/

      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-contract
          path: build/openapi.json

  lint:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff check
        run: uv run ruff check app/ tests/ scripts/

      - name: Check static-analysis suppressions
        run: uv run python scripts/check_suppressions.py

      - name: Ruff format check
        run: uv run ruff format --check app/ tests/ scripts/

      - name: Type check
        run: uv run ty check .

  test:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    needs: lint
    env:
      DATABASE_URL: "sqlite+aiosqlite:///test.db"
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test
      MASTER_API_KEY: test-master-key-for-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Verify architecture contracts
        run: uv run pytest tests/architecture/ -q --tb=short

      - name: Run tests with coverage
        run: >-
          uv run pytest
          tests/unit/ tests/integration/ tests/integration_ssh/
          --cov=app
          --cov-branch
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=95
          -q
          --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: node-nexus-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite+aiosqlite:///test.db \
            -e SECRET_KEY=test-secret-key \
            -e ENVIRONMENT=test \
            -e MASTER_API_KEY=test-master-key \
            node-nexus-api:test python -c "from app.main import app; print('App loaded successfully')"

  e2e-smoke:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build E2E Docker image
        run: docker compose -f tests/docker-compose.e2e.yml build

      - name: Run E2E smoke suite
        run: >-
          uv run pytest tests/e2e/ -m e2e_smoke
          --junit-xml=build/test-results/e2e-smoke.xml
          --tb=short -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-results
          path: build/test-results/

  e2e-full:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    needs: e2e-smoke
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Build E2E Docker image
        run: docker compose -f tests/docker-compose.e2e.yml build

      - name: Run full E2E suite (excluding nightly-only)
        run: >-
          uv run pytest tests/e2e/ -m "docker and not (e2e_resilience or e2e_migration or e2e_slow)"
          --junit-xml=build/test-results/e2e-full.xml
          --durations=10
          --tb=short -q

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          mkdir -p build/logs
          for svc in db dind ssh-server api api-replica; do
            docker compose -f tests/docker-compose.e2e.yml logs --no-color "$svc" > "build/logs/${svc}.log" 2>&1 || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-full-results
          path: build/test-results/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-full-logs
          path: build/logs/

  e2e-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build E2E Docker image
        run: docker compose -f tests/docker-compose.e2e.yml build

      - name: Run nightly E2E suite (resilience + migration + slow)
        run: >-
          uv run pytest tests/e2e/ -m "docker and (e2e_resilience or e2e_migration or e2e_slow)"
          --junit-xml=build/test-results/e2e-nightly-${{ matrix.run }}.xml
          --durations=10
          --tb=short -q

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          mkdir -p build/logs
          for svc in db dind ssh-server api api-replica; do
            docker compose -f tests/docker-compose.e2e.yml logs --no-color "$svc" > "build/logs/${svc}.log" 2>&1 || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-nightly-results-run${{ matrix.run }}
          path: build/test-results/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-nightly-logs-run${{ matrix.run }}
          path: build/logs/

  security:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run bandit security scan
        run: uv run bandit -r app/ -c pyproject.toml

      - name: Check for vulnerable dependencies
        run: uv run pip-audit
