services:
  api:
    build: .
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    env_file: .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:9
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
