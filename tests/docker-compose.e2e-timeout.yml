services:
  db:
    image: postgres:16
    env_file: ../.env.e2e-timeout
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dind:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "2378:2375"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ssh-server:
    build:
      context: ..
      dockerfile: tests/Dockerfile.ssh-docker
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
      - PASSWORD_ACCESS=true
      - DOCKER_HOST=tcp://dind:2375
    ports:
      - "2225:2222"
    depends_on:
      dind:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "docker info"]
      interval: 3s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ..
    ports:
      - "${HOST_PORT_E2E:-8003}:${PORT:-8000}"
    env_file: ../.env.e2e-timeout
    depends_on:
      db:
        condition: service_healthy
      ssh-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; req = urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['MASTER_API_KEY']}); urllib.request.urlopen(req, timeout=5)\""]
      interval: 3s
      timeout: 10s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
