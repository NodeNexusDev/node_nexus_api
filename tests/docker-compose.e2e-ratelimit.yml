services:
  db:
    image: postgres:16
    env_file: ../.env.e2e-ratelimit
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dind:
    image: docker:27-dind
    privileged: true
    command: ["dockerd", "--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "2377:2375"
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 1s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ssh-server:
    build:
      context: ..
      dockerfile: tests/Dockerfile.ssh-docker
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - USER_NAME=testuser
      - USER_PASSWORD=testpass
      - PASSWORD_ACCESS=true
      - DOCKER_HOST=tcp://dind:2375
    ports:
      - "2224:2222"
    volumes:
      - ../tests/ssh-keys:/config/ssh/test-keys
    depends_on:
      dind:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "docker info"]
      interval: 1s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ..
    ports:
      - "${HOST_PORT_E2E:-8002}:${PORT:-8000}"
    env_file: ../.env.e2e-ratelimit
    volumes:
      - ../tests/ssh-keys:/config/ssh/test-keys:ro
    depends_on:
      db:
        condition: service_healthy
      ssh-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; req = urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['MASTER_API_KEY']}); urllib.request.urlopen(req, timeout=5)\""]
      interval: 1s
      timeout: 5s
      retries: 20
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
