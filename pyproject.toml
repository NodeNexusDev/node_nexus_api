[project]
name = "node-nexus-api"
version = "2.3.0"
description = "REST API for managing server nodes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5,<2",
    "apscheduler>=3.11.3,<4",
    "asyncpg>=0.31.0,<1",
    "asyncssh>=2.24.0,<3",
    "bcrypt>=5.0.0,<6",
    "cryptography>=45.0,<51",
    "dishka>=1.10.1,<2",
    "email-validator>=2.2.0,<3",
    "fastapi>=0.140.0,<1",
    "httpx2>=2.9.1,<3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<1",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
    "opentelemetry-sdk>=1.44.0,<2",
    "prometheus-fastapi-instrumentator>=8.0.2,<9",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "PyJWT>=2.13.0,<3",
    "sqlalchemy>=2.0.51,<3",
    "structlog>=26.1.0,<27",
    "uvicorn>=0.51.0,<1",
    "websockets>=17.0,<18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.6.1",
    "ty>=0.0.70",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-docker>=3.2.5",
    "pytest-mock>=3.15.1",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.16.2",
]
docs = [
    "click>=8.3.3",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "openapi-spec-validator>=0.7.2",
    "pymdown-extensions>=11.0.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
extend-select = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"app/api/v2/**/*.py" = ["N816"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not docker"'
markers = [
    "docker: tests requiring running Docker infrastructure (PostgreSQL, SSH)",
    "e2e_smoke: fast E2E tests covering core happy paths",
    "e2e_scheduler: E2E tests for script scheduler execution and failover",
    "e2e_resilience: E2E tests for restart, network failure, and failover scenarios",
    "e2e_migration: E2E tests verifying Alembic migration upgrade paths",
    "e2e_slow: slow E2E tests (timeout, retention, large payloads)",
    "flaky: rerun flaky tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette",
    "ignore::RuntimeWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*", "app/application/ports/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
