[project]
name = "node-nexus-api"
version = "0.1.0"
description = "REST API for managing server nodes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "asyncssh>=2.24.0",
    "cryptography>=49.0.0",
    "dishka>=1.10.1",
    "fastapi>=0.139.0",
    "fastapi-limiter>=0.2.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-docker>=3.2.5",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
