[project]
name = "node-nexus-api"
version = "0.5.0"
description = "REST API for managing server nodes"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "asyncssh>=2.24.0",
    "cryptography>=49.0.0",
    "dishka>=1.10.1",
    "fastapi>=0.139.0",
    "httpx2>=2.9.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "ty>=0.0.59",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-docker>=3.2.5",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.21",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = '-m "not docker"'
markers = [
    "docker: tests requiring running Docker infrastructure (PostgreSQL, SSH)",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
